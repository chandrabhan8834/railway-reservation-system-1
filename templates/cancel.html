{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-4">Cancel Ticket</h3>
                <form method="post">
                    <div class="mb-3">
                        <label>PNR Number</label>
                        <input type="text" name="pnr" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Cancel Booking</button>
                </form>
                {% if pnr %}
                <div class="alert alert-success mt-3">
                    Ticket <strong>{{ pnr }}</strong> cancelled successfully.
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
